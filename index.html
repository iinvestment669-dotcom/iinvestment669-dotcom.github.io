<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1DB954">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DIVINELOVE Wallet</title>
<style>
    :root {
        --primary: #1DB954;
        --primary-dark: #0f9d58;
        --primary-light: #e8f5e9;
        --bg: #f5f7fa;
        --card: #ffffff;
        --text: #1a1a1a;
        --text-light: #6b7280;
        --border: #e5e7eb;
        --danger: #ef4444;
        --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; }
    .header { background: var(--card); padding: 1rem 1.25rem; padding-top: calc(1rem + env(safe-area-inset-top)); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
    .user-info { display: flex; align-items: center; gap: 0.75rem; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.1rem; }
    .greeting { font-size: 0.85rem; color: var(--text-light); }
    .username { font-weight: 600; font-size: 1.1rem; }
    .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 1rem; }
    .balance-card { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 18px; padding: 1.5rem; color: white; margin: 1rem 0; box-shadow: var(--shadow); }
    .balance-label { font-size: 0.9rem; opacity: 0.9; margin-bottom: 0.5rem; }
    .balance-amount { font-size: 2.25rem; font-weight: 700; margin-bottom: 1.25rem; word-break: break-all; }
    .balance-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .btn-white { background: white; color: var(--primary); border: none; padding: 0.9rem; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
    .btn-white:active { transform: scale(0.97); }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1.25rem 0; }
    .action-btn { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem 0.5rem; text-align: center; cursor: pointer; }
    .action-btn:active { transform: scale(0.96); background: var(--primary-light); }
    .action-icon { width: 50px; height: 50px; background: var(--primary-light); border-radius: 14px; margin: 0 auto 0.6rem; display: flex; align-items: center; justify-content: center; }
    .action-icon svg { width: 26px; height: 26px; color: var(--primary); }
    .action-label { font-size: 0.9rem; font-weight: 500; }
    .section { background: var(--card); border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .section-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 1rem; }
    .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .service-item { text-align: center; cursor: pointer; padding: 0.75rem; border-radius: 12px; }
    .service-item:active { transform: scale(0.95); background: var(--bg); }
    .service-icon { width: 58px; height: 58px; background: var(--primary-light); border-radius: 14px; margin: 0 auto 0.6rem; display: flex; align-items: center; justify-content: center; }
    .service-icon svg { width: 28px; height: 28px; color: var(--primary); }
    .service-name { font-size: 0.85rem; color: var(--text-light); font-weight: 500; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); padding: 0.75rem 0; padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; color: var(--text-light); font-size: 0.75rem; cursor: pointer; }
    .nav-item.active { color: var(--primary); }
    .nav-item svg { width: 24px; height: 24px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-end; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card); border-radius: 16px 16px 0 0; padding: 1.5rem; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: var(--bg); border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; }
    .form-group input { width: 100%; padding: 0.9rem; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: var(--primary); }
    .error { color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2rem; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1.5rem; }
    .btn { padding: 0.95rem; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 1rem; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--bg); color: var(--text); }
    .transaction-list { display: flex; flex-direction: column; gap: 0; }
    .transaction { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--border); }
    .transaction:last-child { border-bottom: none; }
    .tx-left { display: flex; align-items: center; gap: 0.75rem; }
    .tx-icon { width: 40px; height: 40px; background: var(--primary-light); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .tx-icon svg { width: 20px; height: 20px; color: var(--primary); }
    .tx-icon.debit { background: #fee2e2; }
    .tx-icon.debit svg { color: var(--danger); }
    .tx-info h4 { font-size: 0.95rem; margin-bottom: 0.25rem; }
    .tx-info p { font-size: 0.8rem; color: var(--text-light); }
    .tx-amount { font-weight: 700; font-size: 0.95rem; }
    .tx-amount.debit { color: var(--danger); }
    .tx-amount.credit { color: var(--primary); }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-light); }
    .toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--text); color: white; padding: 1rem 1.5rem; border-radius: 10px; z-index: 2000; opacity: 0; transition: all 0.3s; font-weight: 500; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
    <div class="header">
        <div class="user-info">
            <div class="avatar">D</div>
            <div>
                <div class="greeting">Hi,</div>
                <div class="username">DIVINELOVE</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="balance-card">
            <div class="balance-label">Available Balance</div>
            <div class="balance-amount" id="balance">₦1,000,000.00</div>
            <div class="balance-actions">
                <button class="btn-white" onclick="openModal('addMoneyModal')">+ Add Money</button>
                <button class="btn-white" onclick="openModal('historyModal')">History</button>
            </div>
        </div>

        <div class="quick-actions">
            <div class="action-btn" onclick="openModal('transferModal')">
                <div class="action-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg></div>
                <div class="action-label">Transfer</div>
            </div>
            <div class="action-btn" onclick="openModal('withdrawModal')">
                <div class="action-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg></div>
                <div class="action-label">Withdraw</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Services</div>
            <div class="services-grid">
                <div class="service-item" onclick="toast('Airtime coming soon')">
                    <div class="service-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg></div>
                    <div class="service-name">Airtime</div>
                </div>
                <div class="service-item" onclick="toast('Data coming soon')">
                    <div class="service-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg></div>
                    <div class="service-name">Data</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></div>
        <div class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg><span>Rewards</span></div>
        <div class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg><span>Cards</span></div>
        <div class="nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span>Me</span></div>
    </div>

    <!-- Transfer Modal -->
    <div class="modal" id="transferModal"><div class="modal-content"><div class="modal-header">Transfer Money<button class="close-btn" onclick="closeModal('transferModal')">×</button></div><div class="form-group"><label>Recipient Name</label><input type="text" id="recipientName" placeholder="Enter recipient name"></div><div class="form-group"><label>Account Number</label><input type="tel" id="accountNumber" placeholder="10-digit account" maxlength="10" inputmode="numeric"></div><div class="form-group"><label>Amount</label><input type="number" id="transferAmount" placeholder="Enter amount" inputmode="decimal"><div class="error" id="transferError"></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('transferModal')">Cancel</button><button class="btn btn-primary" onclick="processTransfer()">Send</button></div></div></div>
    
    <!-- Add Money Modal -->
    <div class="modal" id="addMoneyModal"><div class="modal-content"><div class="modal-header">Add Money<button class="close-btn" onclick="closeModal('addMoneyModal')">×</button></div><div class="form-group"><label>Amount</label><input type="number" id="addAmount" placeholder="Enter amount" inputmode="decimal"><div class="error" id="addError"></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('addMoneyModal')">Cancel</button><button class="btn btn-primary" onclick="addMoney()">Add</button></div></div></div>
    
    <!-- Withdraw Modal -->
    <div class="modal" id="withdrawModal"><div class="modal-content"><div class="modal-header">Withdraw<button class="close-btn" onclick="closeModal('withdrawModal')">×</button></div><div class="form-group"><label>Amount</label><input type="number" id="withdrawAmount" placeholder="Enter amount" inputmode="decimal"><div class="error" id="withdrawError"></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('withdrawModal')">Cancel</button><button class="btn btn-primary" onclick="withdraw()">Withdraw</button></div></div></div>
    
    <!-- History Modal - THIS IS NEW AND WORKING -->
    <div class="modal" id="historyModal"><div class="modal-content"><div class="modal-header">Transaction History<button class="close-btn" onclick="closeModal('historyModal')">×</button></div><div class="transaction-list" id="txList"></div></div></div>

    <div class="toast" id="toast"></div>

<script>
    const DB = {
        getBalance() { return parseFloat(localStorage.getItem('fw_balance') || '1000000'); },
        setBalance(a) { localStorage.setItem('fw_balance', a.toString()); },
        getTx() { return JSON.parse(localStorage.getItem('fw_tx') || '[]'); },
        addTx(tx) { const t = this.getTx(); t.unshift(tx); if(t.length>50) t.pop(); localStorage.setItem('fw_tx', JSON.stringify(t)); }
    };
    let balance = DB.getBalance();
    let transactions = DB.getTx();
    const fmt = a => '₦' + a.toLocaleString('en-NG', {minimumFractionDigits: 2});
    const updateBal = () => { document.getElementById('balance').textContent = fmt(balance); DB.setBalance(balance); };
    const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); };
    const openModal = id => { document.getElementById(id).classList.add('active'); if(id==='historyModal') loadHistory(); };
    const closeModal = id => { document.getElementById(id).classList.remove('active'); document.querySelectorAll('.error').forEach(e => e.textContent = ''); document.querySelectorAll('.modal input').forEach(i => i.value = ''); };
    
    function loadHistory() {
        const list = document.getElementById('txList');
        const txs = DB.getTx();
        if (txs.length === 0) {
            list.innerHTML = '<div class="empty-state">No transactions yet<br><small style="color:var(--text-light)">Your transfers and deposits will appear here</small></div>';
        } else {
            list.innerHTML = txs.map(tx => `
                <div class="transaction">
                    <div class="tx-left">
                        <div class="tx-icon ${tx.type}">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24">
                                ${tx.type === 'credit' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>' : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>'}
                            </svg>
                        </div>
                        <div class="tx-info">
                            <h4>${tx.name}</h4>
                            <p>${tx.date}</p>
                        </div>
                    </div>
                    <div class="tx-amount ${tx.type}">${tx.type === 'debit' ? '-' : '+'}${fmt(tx.amount)}</div>
                </div>
            `).join('');
        }
    }
    
    function processTransfer() {
        const name = document.getElementById('recipientName').value.trim();
        const acc = document.getElementById('accountNumber').value.trim();
        const amt = parseFloat(document.getElementById('transferAmount').value);
        const err = document.getElementById('transferError');
        err.textContent = '';
        if (!name) return err.textContent = 'Enter recipient name';
        if (acc.length !== 10 || !/^\d+$/.test(acc)) return err.textContent = 'Enter valid 10-digit account';
        if (!amt || amt <= 0) return err.textContent = 'Enter valid amount';
        if (amt > balance) return err.textContent = 'Insufficient balance';
        balance -= amt;
        DB.addTx({type:'debit', name:`Transfer to ${name}`, amount:amt, date:new Date().toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'})});
        updateBal(); closeModal('transferModal'); toast(`Sent ${fmt(amt)} to ${name}`);
    }
    
    function addMoney() {
        const amt = parseFloat(document.getElementById('addAmount').value);
        const err = document.getElementById('addError');
        err.textContent = '';
        if (!amt || amt <= 0) return err.textContent = 'Enter valid amount';
        balance += amt;
        DB.addTx({type:'credit', name:'Money Added', amount:amt, date:new Date().toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'})});
        updateBal(); closeModal('addMoneyModal'); toast(`Added ${fmt(amt)}`);
    }
    
    function withdraw() {
        const amt = parseFloat(document.getElementById('withdrawAmount').value);
        const err = document.getElementById('withdrawError');
        err.textContent = '';
        if (!amt || amt <= 0) return err.textContent = 'Enter valid amount';
        if (amt > balance) return err.textContent = 'Insufficient balance';
        balance -= amt;
        DB.addTx({type:'debit', name:'Withdrawal', amount:amt, date:new Date().toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'})});
        updateBal(); closeModal('withdrawModal'); toast(`Withdrew ${fmt(amt)}`);
    }
    
    document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if(e.target === m) closeModal(m.id); }));
    updateBal();
</script>
</body>
</html>
