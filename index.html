<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Payment Platform</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 18px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #333;
            margin-bottom: 16px;
            font-size: 18px;
        }

        .balance {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .balance-label {
            color: #888;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            margin-bottom: 4px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }

        .btn-success:hover {
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #fc8181 0%, #e53e3e 100%);
        }

        .transaction-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-amount.positive {
            color: #48bb78;
        }

        .transaction-amount.negative {
            color: #fc8181;
        }

        .transaction-details {
            font-size: 14px;
        }

        .transaction-details .name {
            font-weight: 500;
            color: #333;
        }

        .transaction-details .time {
            color: #999;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.completed {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-badge.pending {
            background: #fefcbf;
            color: #744210;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert.error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #feb2b2;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .user-card {
            background: #f7fafc;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .user-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .user-card.selected {
            border-color: #667eea;
            background: #eef2ff;
        }

        .user-card .name {
            font-weight: 600;
            color: #333;
        }

        .user-card .balance {
            font-size: 18px;
            color: #667eea;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Payment Platform</h1>
            <p>Send and receive real USD payments instantly</p>
        </header>

        <div id="alert" class="alert"></div>

        <div class="dashboard">
            <div class="card">
                <h3>💳 Your Balance</h3>
                <div class="balance-label">Available Balance</div>
                <div class="balance" id="balanceDisplay">$0.00</div>
                <div style="margin-top: 12px; font-size: 14px; color: #888;">
                    <span id="userIdDisplay">User: </span>
                </div>
            </div>

            <div class="card">
                <h3>📤 Send Money</h3>
                <div class="input-group">
                    <label>Select Recipient</label>
                    <select id="recipientSelect">
                        <option value="">Select a user...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Amount (USD)</label>
                    <input type="number" id="amountInput" placeholder="0.00" min="0.01" step="0.01">
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <input type="text" id="descriptionInput" placeholder="What's this for?">
                </div>
                <button class="btn btn-success" onclick="sendMoney()">Send Money 💸</button>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h3>👥 Users</h3>
                <div class="users-grid" id="usersList">
                    <!-- Users will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>📜 Recent Transactions</h3>
                <div class="transaction-list" id="transactionsList">
                    <div style="color: #999; text-align: center; padding: 20px;">
                        No transactions yet
                    </div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>💳 Add Funds (Credit Card)</h3>
            <p style="color: #888; margin-bottom: 16px;">Add real money to your account using Stripe</p>
            <div class="row">
                <div class="input-group">
                    <label>Amount to Add</label>
                    <input type="number" id="depositAmount" placeholder="0.00" min="1" step="1">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="btn" onclick="addFunds()">Add Funds 💳</button>
                </div>
            </div>
            <div id="card-element" style="margin-top: 12px; display: none;"></div>
        </div>
    </div>

    <script>
        const stripe = Stripe('pk_test_your_publishable_key_here'); // Replace with your Stripe publishable key
        let currentUser = 'user123';
        let users = [];
        let userBalance = 0;

        // Load users
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                users = await response.json();
                renderUsers();
                populateRecipients();
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Load balance
        async function loadBalance() {
            try {
                const response = await fetch(`/api/balance/${currentUser}`);
                const data = await response.json();
                userBalance = data.balance;
                document.getElementById('balanceDisplay').textContent = `$${data.balance.toFixed(2)}`;
                document.getElementById('userIdDisplay').textContent = `User: ${data.name}`;
                renderTransactions(data.transactions || []);
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        // Render users
        function renderUsers() {
            const container = document.getElementById('usersList');
            container.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-card';
                if (user.id === currentUser) {
                    div.classList.add('selected');
                }
                div.innerHTML = `
                    <div class="name">${user.name}</div>
                    <div class="balance">$${user.balance.toFixed(2)}</div>
                    <div style="font-size: 11px; color: #999;">${user.id}</div>
                `;
                container.appendChild(div);
            });
        }

        // Populate recipient dropdown
        function populateRecipients() {
            const select = document.getElementById('recipientSelect');
            select.innerHTML = '<option value="">Select a user...</option>';
            users.forEach(user => {
                if (user.id !== currentUser) {
                    const option = document.createElement('option');
                    option.value = user.id;
                    option.textContent = `${user.name} ($${user.balance.toFixed(2)})`;
                    select.appendChild(option);
                }
            });
        }

        // Render transactions
        function renderTransactions(transactions) {
            const container = document.getElementById('transactionsList');
            if (!transactions || transactions.length === 0) {
                container.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">No transactions yet</div>';
                return;
            }

            container.innerHTML = '';
            transactions.slice().reverse().forEach(tx => {
                const div = document.createElement('div');
                div.className = 'transaction-item';
                const isSender = tx.from === 'John Doe'; // Replace with actual user check

                div.innerHTML = `
                    <div class="transaction-details">
                        <div class="name">${isSender ? '→ ' + tx.to : '← ' + tx.from}</div>
                        <div class="time">${new Date(tx.timestamp).toLocaleString()}</div>
                        <div style="font-size: 12px; color: #888;">${tx.description || 'Transfer'}</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="transaction-amount ${isSender ? 'negative' : 'positive'}">
                            ${isSender ? '-' : '+'}$${tx.amount.toFixed(2)}
                        </div>
                        <span class="status-badge ${tx.status}">${tx.status}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Send money
        async function sendMoney() {
            const recipientId = document.getElementById('recipientSelect').value;
            const amount = parseFloat(document.getElementById('amountInput').value);
            const description = document.getElementById('descriptionInput').value || 'Transfer';

            if (!recipientId) {
                showAlert('Please select a recipient', 'error');
                return;
            }

            if (!amount || amount <= 0) {
                showAlert('Please enter a valid amount', 'error');
                return;
            }

            if (amount > userBalance) {
                showAlert('Insufficient balance!', 'error');
                return;
            }

            try {
                const response = await fetch('/api/send-money', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fromUserId: currentUser,
                        toUserId: recipientId,
                        amount: amount,
                        description: description
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert(`✅ Sent $${amount.toFixed(2)} to ${data.transaction.to}`, 'success');
                    document.getElementById('amountInput').value = '';
                    document.getElementById('descriptionInput').value = '';
                    loadBalance();
                    loadUsers();
                } else {
                    showAlert('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showAlert('❌ Error sending money: ' + error.message, 'error');
            }
        }

        // Add funds with Stripe
        async function addFunds() {
            const amount = parseFloat(document.getElementById('depositAmount').value);

            if (!amount || amount < 1) {
                showAlert('Please enter a valid amount (minimum $1)', 'error');
                return;
            }

            try {
                // Create payment intent
                const response = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: amount,
                        description: 'Add funds to wallet'
                    })
                });

                const data = await response.json();

                if (data.clientSecret) {
                    // In a real app, you'd use Stripe Elements here
                    showAlert(`✅ Payment initiated! Add $${amount.toFixed(2)} to your account.`, 'success');
                    
                    // Simulate successful payment (in production, confirm with Stripe)
                    setTimeout(async () => {
                        const confirmResponse = await fetch('/api/confirm-payment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                paymentIntentId: data.paymentIntentId,
                                userId: currentUser,
                                recipientId: currentUser,
                                amount: amount
                            })
                        });

                        const confirmData = await confirmResponse.json();
                        if (confirmData.success) {
                            showAlert(`✅ Added $${amount.toFixed(2)} to your balance!`, 'success');
                            document.getElementById('depositAmount').value = '';
                            loadBalance();
                            loadUsers();
                        }
                    }, 2000);
                }
            } catch (error) {
                showAlert('❌ Error adding funds: ' + error.message, 'error');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert show ${type}`;
            
            setTimeout(() => {
                alert.className = 'alert';
            }, 5000);
        }

        // Initialize
        loadUsers();
        loadBalance();

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadBalance();
            loadUsers();
        }, 30000);
    </script>
</body>
</html>
