<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1DB954">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinWallet">
<meta name="mobile-web-app-capable" content="yes">
<title>FinWallet</title>
<style>
    :root {
        --primary: #1DB954;
        --primary-dark: #0f9d58;
        --primary-light: #e8f5e9;
        --bg: #f5f7fa;
        --card: #ffffff;
        --text: #1a1a1a;
        --text-light: #6b7280;
        --border: #e5e7eb;
        --danger: #ef4444;
        --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding-bottom: 80px;
        overscroll-behavior: none;
    }
    
    .header {
        background: var(--card);
        padding: 1rem 1.5rem;
        padding-top: calc(1rem + env(safe-area-inset-top));
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 100;
    }
    
    .user-info {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    
    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
    }
    
    .greeting {
        font-size: 0.9rem;
        color: var(--text-light);
    }
    
    .username {
        font-weight: 600;
        font-size: 1.1rem;
    }
    
    .container {
        max-width: 480px;
        margin: 0 auto;
        padding: 1rem;
    }
    
    .balance-card {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border-radius: 16px;
        padding: 1.5rem;
        color: white;
        margin: 1rem 0;
        box-shadow: var(--shadow);
    }
    
    .balance-label {
        font-size: 0.9rem;
        opacity: 0.9;
        margin-bottom: 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .balance-amount {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1rem;
        letter-spacing: -0.5px;
    }
    
    .balance-actions {
        display: flex;
        gap: 0.75rem;
    }
    
    .btn-white {
        flex: 1;
        background: white;
        color: var(--primary);
        border: none;
        padding: 0.75rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.95rem;
    }
    
    .btn-white:active {
        transform: scale(0.98);
    }
    
    .quick-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin: 1.5rem 0;
    }
    
    .action-btn {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem 0.5rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
    }
    
    .action-btn:active {
        transform: scale(0.95);
        border-color: var(--primary);
    }
    
    .action-icon {
        width: 48px;
        height: 48px;
        background: var(--primary-light);
        border-radius: 12px;
        margin: 0 auto 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .action-icon svg {
        width: 24px;
        height: 24px;
        color: var(--primary);
    }
    
    .action-label {
        font-size: 0.85rem;
        font-weight: 500;
    }
    
    .section {
        background: var(--card);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 1rem;
        box-shadow: var(--shadow);
    }
    
    .section-title {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 1rem;
    }
    
    .services-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
    }
    
    .service-item {
        text-align: center;
        cursor: pointer;
    }
    
    .service-item:active {
        transform: scale(0.95);
    }
    
    .service-icon {
        width: 56px;
        height: 56px;
        background: var(--primary-light);
        border-radius: 12px;
        margin: 0 auto 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .service-icon svg {
        width: 28px;
        height: 28px;
        color: var(--primary);
    }
    
    .service-name {
        font-size: 0.8rem;
        color: var(--text-light);
    }
    
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--card);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-around;
        padding: 0.75rem 0;
        padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
    }
    
    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        color: var(--text-light);
        font-size: 0.75rem;
        cursor: pointer;
    }
    
    .nav-item.active {
        color: var(--primary);
    }
    
    .nav-item svg {
        width: 24px;
        height: 24px;
    }
    
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        align-items: flex-end;
        justify-content: center;
    }
    
    .modal.active {
        display: flex;
    }
    
    .modal-content {
        background: var(--card);
        border-radius: 16px 16px 0 0;
        padding: 1.5rem;
        width: 100%;
        max-width: 480px;
        max-height: 85vh;
        overflow-y: auto;
        animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }
    
    .modal-header {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
    }
    
    .form-group {
        margin-bottom: 1rem;
    }
    
    .form-group label {
        display: block;
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
    }
    
    .form-group input, .form-group select {
        width: 100%;
        padding: 0.875rem;
        border: 2px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
        background: white;
    }
    
    .form-group input:focus, .form-group select:focus {
        outline: none;
        border-color: var(--primary);
    }
    
    .error {
        color: var(--danger);
        font-size: 0.85rem;
        margin-top: 0.5rem;
        min-height: 1.2rem;
    }
    
    .modal-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.5rem;
    }
    
    .btn {
        flex: 1;
        padding: 0.875rem;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
    }
    
    .btn:active {
        transform: scale(0.98);
    }
    
    .btn-primary {
        background: var(--primary);
        color: white;
    }
    
    .btn-secondary {
        background: var(--bg);
        color: var(--text);
    }
    
    .transaction-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-height: 400px;
        overflow-y: auto;
    }
    
    .transaction {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--border);
    }
    
    .transaction:last-child {
        border-bottom: none;
    }
    
    .tx-info h4 {
        font-size: 0.95rem;
        margin-bottom: 0.25rem;
    }
    
    .tx-info p {
        font-size: 0.8rem;
        color: var(--text-light);
    }
    
    .tx-amount {
        font-weight: 600;
    }
    
    .tx-amount.debit {
        color: var(--danger);
    }
    
    .tx-amount.credit {
        color: var(--primary);
    }
    
    .toast {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: var(--text);
        color: white;
        padding: 1rem 1.5rem;
        border-radius: 8px;
        box-shadow: var(--shadow);
        z-index: 2000;
        opacity: 0;
        transition: all 0.3s;
    }
    
    .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
    
    .data-plans {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin: 1rem 0;
    }
    
    .data-plan {
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
    }
    
    .data-plan.selected {
        border-color: var(--primary);
        background: var(--primary-light);
    }
    
    .data-plan:active {
        transform: scale(0.98);
    }
    
    .plan-size {
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--text);
    }
    
    .plan-price {
        font-size: 0.9rem;
        color: var(--text-light);
        margin-top: 0.25rem;
    }
</style>
</head>
<body>
    <div class="header">
        <div class="user-info">
            <div class="avatar">D</div>
            <div>
                <div class="greeting">Hi,</div>
                <div class="username" id="username">DIVINELOVE</div>
            </div>
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
    </div>

    <div class="container">
        <div class="balance-card">
            <div class="balance-label">
                <span>Available Balance</span>
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="opacity:0.9;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
            </div>
            <div class="balance-amount" id="balance">₦1,000,000.00</div>

                <button class="btn-white" onclick="openModal('addMoneyModal')">+ Add Money</button>
                <button class="btn-white" onclick="showHistory()">History</button>
            </div>
        </div>

        <div class="quick-actions">
            <div class="action-btn" onclick="openModal('transferModal')">
                <div class="action-icon">

                    </svg>
                </div>
                <div class="action-label">Transfer</div>
            </div>
            <div class="action-btn" onclick="openModal('withdrawModal')">
                <div class="action-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    </svg>
                </div>
                <div class="action-label">Withdraw</div>
            </div>
            <div class="action-btn" onclick="openModal('dataModal')">
                <div class="action-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>

                </div>
                <div class="action-label">Buy Data</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Services</div>
            <div class="services-grid">
                <div class="service-item" onclick="openModal('airtimeModal')">
                    <div class="service-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                    </div>
                    <div class="service-name">Airtime</div>
                </div>
                <div class="service-item" onclick="openModal('dataModal')">
                    <div class="service-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <div class="service-name">Data</div>
                </div>

                    <div class="service-icon">

                    </div>
                    <div class="service-name">TV</div>
                </div>
                <div class="service-item" onclick="showToast('Loans coming soon')">
                    <div class="service-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <div class="service-name">Loans</div>
                </div>

        <div class="section" id="historySection" style="display:none;">
            <div class="section-title">Transaction History</div>
            <div class="transaction-list" id="txList"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg>

        </div>
        <div class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
            <span>Cards</span>
        </div>
        <div class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span>Me</span>
        </div>
    </div>

    <div class="modal" id="transferModal">
        <div class="modal-content">
            <div class="modal-header">Transfer Money</div>
            <div class="form-group">
                <label>Recipient Name</label>
                <input type="text" id="recipientName" placeholder="Enter recipient name">
            </div>
            <div class="form-group">
                <label>Account Number</label>
                <input type="tel" id="accountNumber" placeholder="10-digit account number" maxlength="10" inputmode="numeric">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="transferAmount" placeholder="Enter amount" inputmode="decimal">
                <div class="error" id="transferError"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('transferModal')">Cancel</button>
                <button class="btn btn-primary" onclick="processTransfer()">Send</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addMoneyModal">
        <div class="modal-content">
            <div class="modal-header">Add Money</div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="addAmount" placeholder="Enter amount" inputmode="decimal">
                <div class="error" id="addError"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('addMoneyModal')">Cancel</button>
                <button class="btn btn-primary" onclick="addMoney()">Add</button>
            </div>
        </div>
    </div>

    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <div class="modal-header">Withdraw</div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="withdrawAmount" placeholder="Enter amount" inputmode="decimal">
                <div class="error" id="withdrawError"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('withdrawModal')">Cancel</button>
                <button class="btn btn-primary" onclick="withdraw()">Withdraw</button>
            </div>
        </div>
    </div>

    <div class="modal" id="airtimeModal">
        <div class="modal-content">
            <div class="modal-header">Buy Airtime</div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="airtimePhone" placeholder="08012345678" maxlength="11" inputmode="tel">
            </div>
            <div class="form-group">
                <label>Network</label>
                <select id="airtimeNetwork">
                    <option value="">Select Network</option>
                    <option value="MTN">MTN</option>
                    <option value="Glo">Glo</option>
                    <option value="Airtel">Airtel</option>
                    <option value="9mobile">9mobile</option>
                </select>
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="airtimeAmount" placeholder="Enter amount" inputmode="decimal">
                <div class="error" id="airtimeError"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('airtimeModal')">Cancel</button>
                <button class="btn btn-primary" onclick="buyAirtime()">Buy</button>
            </div>
        </div>
    </div>

    <div class="modal" id="dataModal">
        <div class="modal-content">
            <div class="modal-header">Buy Data</div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="dataPhone" placeholder="08012345678" maxlength="11" inputmode="tel">
            </div>
            <div class="form-group">
                <label>Network</label>
                <select id="dataNetwork">
                    <option value="">Select Network</option>
                    <option value="MTN">MTN</option>
                    <option value="Glo">Glo</option>
                    <option value="Airtel">Airtel</option>
                    <option value="9mobile">9mobile</option>
                </select>
            </div>
            <div class="form-group">
                <label>Select Plan</label>
                <div class="data-plans" id="dataPlans">
                    <div class="data-plan" onclick="selectPlan(this, 500, '500MB')">
                        <div class="plan-size">500MB</div>
                        <div class="plan-price">₦500</div>
                    </div>
                    <div class="data-plan" onclick="selectPlan(this, 1000, '1GB')">
                        <div class="plan-size">1GB</div>
                        <div class="plan-price">₦1,000</div>
                    </div>
                    <div class="data-plan" onclick="selectPlan(this, 2000, '2GB')">
                        <div class="plan-size">2GB</div>
                        <div class="plan-price">₦2,000</div>
                    </div>
                    <div class="data-plan" onclick="selectPlan(this, 5000, '5GB')">
                        <div class="plan-size">5GB</div>
                        <div class="plan-price">₦5,000</div>
                    </div>
                <div class="error" id="dataError"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('dataModal')">Cancel</button>
                <button class="btn btn-primary" onclick="buyData()">Buy</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

<script>
    // Local Backend using localStorage
    const DB = {
        getBalance() {
            return parseFloat(localStorage.getItem('finwallet_balance') || '1000000');
        },
        setBalance(amount) {
            localStorage.setItem('finwallet_balance', amount.toString());
        },
        getTransactions() {
            return JSON.parse(localStorage.getItem('finwallet_transactions') || '[]');
        },
        addTransaction(tx) {
            const txs = this.getTransactions();
            txs.unshift(tx);
            if (txs.length > 50) txs.pop();
            localStorage.setItem('finwallet_transactions', JSON.stringify(txs));
        },
        getUsername() {
            return localStorage.getItem('finwallet_username') || 'DIVINELOVE';
        },
        setUsername(name) {
            localStorage.setItem('finwallet_username', name);
        }
    };

    let balance = DB.getBalance();
    let transactions = DB.getTransactions();
    let selectedDataPlan = null;

    function formatCurrency(amount) {
        return '₦' + amount.toLocaleString('en-NG', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function updateBalance() {
        document.getElementById('balance').textContent = formatCurrency(balance);
        DB.setBalance(balance);
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
        document.querySelectorAll('.error').forEach(e => e.textContent = '');
        document.querySelectorAll('.modal input').forEach(i => i.value = '');
        document.querySelectorAll('.modal select').forEach(s => s.selectedIndex = 0);
        document.querySelectorAll('.data-plan').forEach(p => p.classList.remove('selected'));
        selectedDataPlan = null;
    }

    function showHistory() {
        const section = document.getElementById('historySection');
        const list = document.getElementById('txList');
        
        if (transactions.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--text-light); padding:2rem;">No transactions yet</p>';
        } else {
            list.innerHTML = transactions.map(tx => `
                <div class="transaction">
                    <div class="tx-info">
                        <h4>${tx.name}</h4>
                        <p>${tx.date}</p>
                    </div>
                    <div class="tx-amount ${tx.type}">${tx.type === 'debit' ? '-' : '+'}${formatCurrency(tx.amount)}</div>
                </div>
            `).join('');
        }
        
        section.style.display = 'block';
        section.scrollIntoView({behavior: 'smooth'});
    }

    function processTransfer() {
        const name = document.getElementById('recipientName').value.trim();
        const account = document.getElementById('accountNumber').value.trim();
        const amount = parseFloat(document.getElementById('transferAmount').value);
        const error = document.getElementById('transferError');
        
        error.textContent = '';
        
        if (!name) {
            error.textContent = 'Please enter recipient name';
            return;
        }
        if (account.length !== 10 || !/^\d+$/.test(account)) {
            error.textContent = 'Enter valid 10-digit account number';
            return;
        }
        if (!amount || amount <= 0) {
            error.textContent = 'Enter a valid amount';
            return;
        }
        if (amount > balance) {
            error.textContent = 'Insufficient balance';
            return;
        }
        
        balance -= amount;
        const tx = {
            type: 'debit',
            name: `Transfer to ${name}`,
            amount: amount,
            date: new Date().toLocaleString('en-NG', {dateStyle: 'short', timeStyle: 'short'})
        };
        transactions.unshift(tx);
        DB.addTransaction(tx);
        updateBalance();
        closeModal('transferModal');
        showToast(`Sent ${formatCurrency(amount)} to ${name}`);
    }

    function addMoney() {
        const amount = parseFloat(document.getElementById('addAmount').value);
        const error = document.getElementById('addError');
        
        error.textContent = '';
        
        if (!amount || amount <= 0) {
            error.textContent = 'Enter a valid amount';
            return;
        }
        
        balance += amount;
        const tx = {
            type: 'credit',
            name: 'Money Added',
            amount: amount,
            date: new Date().toLocaleString('en-NG', {dateStyle: 'short', timeStyle: 'short'})
        };
        transactions.unshift(tx);
        DB.addTransaction(tx);
        updateBalance();
        closeModal('addMoneyModal');
        showToast(`Added ${formatCurrency(amount)}`);
    }
