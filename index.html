<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI - Smart Website</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#08080c;color:white}
nav{position:sticky;top:0;background:rgba(8,8,12,0.9);backdrop-filter:blur(20px);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e1e25;z-index:10}
.logo{font-weight:900;font-size:20px} .logo b{color:#8b5cf6}
.chat-wrap{max-width:700px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
.header{padding:20px;text-align:center;border-bottom:1px solid #1e1e25}
.header h1{font-size:22px} .header p{color:#888;font-size:13px;margin-top:6px}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:85%;animation:pop .3s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.msg.user{align-self:flex-end}
.msg.ai{align-self:flex-start}
.bubble{padding:13px 16px;border-radius:18px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
.user .bubble{background:#8b5cf6;color:white;border-bottom-right-radius:5px}
.ai .bubble{background:#18181f;border:1px solid #252530;color:#e5e5e5;border-bottom-left-radius:5px}
.typing{color:#666;font-size:12px;padding:0 20px 8px;display:none}
.input-bar{padding:12px;background:#0f0f14;border-top:1px solid #1e1e25;display:flex;gap:8px;align-items:center}
.input-bar input{flex:1;background:#1c1c24;border:1px solid #2a2a35;padding:13px 16px;border-radius:100px;color:white;outline:none;font-size:15px}
.input-bar button{background:#8b5cf6;border:none;width:46px;height:46px;border-radius:50%;color:white;font-weight:bold;font-size:18px}
.quick{padding:10px 16px;display:flex;gap:8px;overflow-x:auto;white-space:nowrap}
.quick span{background:#1c1c24;border:1px solid #2a2a35;padding:8px 14px;border-radius:100px;font-size:12px;color:#aaa;cursor:pointer}
</style>
</head>
<body>
<nav><div class="logo">NOVA <b>AI</b></div><div style="font-size:11px;color:#666">● LIVE • Answers Everything</div></nav>
<div class="chat-wrap">
<div class="header"><h1>Ask Me Anything</h1><p>Your AI website now answers ALL questions</p></div>
<div class="quick">
<span onclick="ask('Who are you?')">Who are you?</span>
<span onclick="ask('Write a business plan for Onitsha')">Business plan</span>
<span onclick="ask('Generate code')">Write code</span>
<span onclick="ask('Make money with AI in Nigeria?')">Make money</span>
<span onclick="ask('What is AI?')">What is AI?</span>
</div>
<div class="messages" id="msgs">
<div class="msg ai"><div class="bubble">Hey! I'm NOVA — your new AI website. 👋 I now answer EVERY question intelligently. What do you want to ask?</div></div>
</div>
<div class="typing" id="typing">NOVA is thinking...</div>
<div class="input-bar">
<input id="inp" placeholder="Type any question..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">↑</button>
</div>
</div>
<script>
const msgsEl=document.getElementById('msgs');
const inpEl=document.getElementById('inp');
const typingEl=document.getElementById('typing');
function ask(t){inpEl.value=t;send();}
function getSmartAnswer(q){
  const lower=q.toLowerCase();
  if(lower.match(/who are you|what are you|your name/)){
    return "I'm NOVA AI — the AI website you just created! I answer any question, write content, generate ideas, code, and help your customers 24/7.";
  }
  if(lower.match(/what is ai|define ai|artificial intelligence/)){
    return "AI is technology that lets computers think like humans. It powers ChatGPT, image generators, and now — YOUR website!";
  }
  if(lower.match(/code|website|html|css|javascript|python/)){
    return `For: "${q}"\nI can write full code for you. Tell me exactly what app you want (e.g., "Login page", "POS system") and I'll generate it.`;
  }
  if(lower.match(/business|onitsha|shop|money|nigeria/)){
    return `For "${q}":\n1. Find what people in Onitsha need\n2. Use AI to solve it\n3. Market on WhatsApp/Facebook\n4. Collect with Paystack\nTell me your exact business and I'll write full plan in Naira.`;
  }
  return `You asked: "${q}"\n\n${generateGeneralAnswer(q)}`;
}
function generateGeneralAnswer(q){
  const lower=q.toLowerCase();
  if(lower.includes("what is")||lower.includes("who is")){
    return `About ${q}: It's an important concept. In simple terms, I can explain it with Nigerian examples. Ask "explain simpler" if you need.`;
  }
  if(lower.includes("how to")){
    return `Step-by-step for: ${q}\n1. Clear goal\n2. Gather tools\n3. Start small\n4. Use AI to automate\n5. Improve\nWant it more specific? Tell me what you have.`;
  }
  return `I understand "${q}". I can break it into simple points, examples, pros/cons, and next steps. Tell me if you want it for school, business, or pidgin and I'll adapt.`;
}
function send(){
  const text=inpEl.value.trim();if(!text)return;
  const u=document.createElement('div');u.className='msg user';u.innerHTML=`<div class="bubble">${text}</div>`;msgsEl.appendChild(u);
  inpEl.value='';msgsEl.scrollTop=msgsEl.scrollHeight;
  typingEl.style.display='block';
  setTimeout(()=>{
    typingEl.style.display='none';
    const ans=getSmartAnswer(text);
    const a=document.createElement('div');a.className='msg ai';a.innerHTML=`<div class="bubble">${ans}</div>`;msgsEl.appendChild(a);
    msgsEl.scrollTop=msgsEl.scrollHeight;
  },700);
}
</script>
</body>
</html>
