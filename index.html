<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City Racer 3D</title>
    <!-- PixiJS Engine loaded safely via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, Helvetica, sans-serif; background: #000; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; pointer-events: none; }
        #gameOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); color: white; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        #gameOverlay.active { opacity: 1; pointer-events: auto; }
        #gameOverlay h1 { font-size: 48px; margin-bottom: 10px; color: #ff4757; }
        #gameOverlay p { font-size: 18px; color: #ccc; }
        button { padding: 15px 40px; font-size: 22px; background: #ff4757; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5); margin-top: 20px; pointer-events: auto; }
        button:disabled { background: #555; box-shadow: none; cursor: not-allowed; }
        #controls-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 14px; z-index: 10; text-align: center; }
    </style>
</head>
<body>

    <div id="ui">Speed: <span id="score">0</span></div>

    <div id="gameOverlay">
        <h1>🚗 CRASHED!</h1>
        <p>Your car was destroyed.</p>
        <button id="restartBtn">Respawn & Drive Again</button>
    </div>

    <div id="controls-hint">⬆️ Accelerate | ⬇️ Brake | ⬅️ ➡️ Steer</div>

    <script>
        // --- PROFESSIONAL GAME SETUP ---
        const app = new PIXI.Application({
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0x2c3e50,
            resolution: window.devicePixelRatio || 1,
        });
        document.body.appendChild(app.view);

        // --- GAME ASSETS (Built entirely from code - no images needed) ---
        const roadWidth = 200;
        const segmentLength = 10;
        const numSegments = 80;
        const viewDistance = 20; // How far ahead we see

        let position = 0; // Player Z position
        let speed = 0;
        let playerX = 0; // Player X position
        let maxSpeed = 15;
        let accel = 0.5;
        let friction = 0.97;
        let steering = 0;
        const roadSegments = [];

        // Build the road data (hills and curves)
        for (let i = 0; i < numSegments; i++) {
            roadSegments.push({
                p1: { world: { z: i * segmentLength } },
                p2: { world: { z: (i + 1) * segmentLength } },
                curve: (i > 30 && i < 50) ? 2 : (i > 60 ? -1.5 : 0), // Simulate a curve
                color: Math.floor(i / 4) % 2 === 0 ? 0x2ecc71 : 0x27ae60 // Green grass alternating
            });
        }

        // Container for 3D projection
        const worldContainer = new PIXI.Container();
        worldContainer.x = app.screen.width / 2;
        worldContainer.y = app.screen.height / 2 + 50;
        app.stage.addChild(worldContainer);

        // --- CORE GAME LOOP (3D Projection) ---
        function projectPoint(x, y, z, cameraX, cameraY, cameraZ) {
            // Translate relative to camera
            let relX = x - cameraX;
            let relY = y - cameraY;
            let relZ = z - cameraZ;

            // 3D to 2D projection math
            let scale = 1000 / relZ; 
            let screenX = relX * scale;
            let screenY = -relY * scale; 
            return { x: screenX, y: screenY, scale: scale };
        }

        function renderFrame() {
            worldContainer.removeChildren();

            let playerZ = position;
            let cameraX = playerX;
            let cameraY = 1000; // Height of camera (bird's eye racing style)
            let cameraZ = playerZ - 50; // Camera trails behind player

            // Draw road segments furthest to closest
            let startSeg = Math.floor(playerZ / segmentLength);
            
            for (let i = 0; i < viewDistance; i++) {
                let segIndex = (startSeg + i) % numSegments;
                let seg = roadSegments[segIndex];
                // Offset Z based on looping
                let zOffset = segIndex < startSeg ? numSegments * segmentLength : 0;
                
                let z1 = seg.p1.world.z + zOffset;
                let z2 = seg.p2.world.z + zOffset;

                // Apply curve to X position
                let x1 = seg.curve * 10;
                let x2 = seg.curve * 10;

                // Project 4 corners of the road segment
                let p1L = projectPoint(x1 - roadWidth, 0, z1, cameraX, cameraY, cameraZ);
                let p1R = projectPoint(x1 + roadWidth, 0, z1, cameraX, cameraY, cameraZ);
                let p2L = projectPoint(x2 - roadWidth, 0, z2, cameraX, cameraY, cameraZ);
                let p2R = projectPoint(x2 + roadWidth, 0, z2, cameraX, cameraY, cameraZ);

                // Draw the road polygon
                let poly = new PIXI.Polygon([
                    p1L.x, p1L.y,
                    p1R.x, p1R.y,
                    p2R.x, p2R.y,
                    p2L.x, p2L.y
                ]);

                let gfx = new PIXI.Graphics();
                gfx.beginFill(seg.color);
                gfx.drawShape(poly);
                gfx.endFill();
                
                // Draw lane marks
                if(i % 2 === 0) {
                    let cL = projectPoint(x1, 0, z1, cameraX, cameraY, cameraZ);
                    let cR = projectPoint(x2, 0, z2, cameraX, cameraY, cameraZ);
                    gfx.lineStyle(2, 0xffffff, 0.5);
                    gfx.moveTo(cL.x, cL.y);
                    gfx.lineTo(cR.x, cR.y);
                }

                worldContainer.addChild(gfx);
            }

            // Draw Player Car
            let carPos = projectPoint(playerX, 0, playerZ + 5, cameraX, cameraY, cameraZ);
            let carScale = Math.min(1, carPos.scale / 200);
            let car = new PIXI.Graphics();
            car.beginFill(0xff4757);
            car.drawRect(-15, -10, 30, 20);
            car.endFill();
            car.x = carPos.x;
            car.y = carPos.y;
            car.scale.set(carScale, carScale);
            worldContainer.addChild(car);
        }

        // --- PHYSICS UPDATE ---
        function updateGame() {
            // Acceleration
            if (keys['ArrowUp'] || keys['w']) speed = Math.min(speed + accel, maxSpeed);
            else if (keys['ArrowDown'] || keys['s']) speed = Math.max(speed - accel * 2, -maxSpeed / 3);
            else speed *= friction;

            // Steering (Only when moving)
            if (Math.abs(speed) > 0.5) {
                if (keys['ArrowLeft'] || keys['a']) playerX -= 2;
                if (keys['ArrowRight'] || keys['d']) playerX += 2;
            }

            // Move forward
            position += speed;

            // Keep player on road (X clamping)
            playerX = Math.max(-roadWidth + 10, Math.min(roadWidth - 10, playerX));

            // Update Score
            document.getElementById('score').innerText = Math.floor(position / 5);

            // Check for Crash! (If player goes off road completely)
            if (Math.abs(playerX) > roadWidth - 5) {
                gameOver();
            }

            // Loop world
            if (position > numSegments * segmentLength) position = 0;
        }

        // --- GAME STATE & AD LOGIC (FROM YOUR SCREENSHOT) ---
        let isPaused = false;
        let isGameOver = false;
        const overlay = document.getElementById('gameOverlay');
        const restartBtn = document.getElementById('restartBtn');
        const keys = {};

        document.addEventListener('keydown', (e) => keys[e.key] = true);
        document.addEventListener('keyup', (e) => keys[e.key] = false);

        function gameOver() {
            if(isGameOver) return;
            isGameOver = true;
            isPaused = true;
            overlay.classList.add('active');
            restartBtn.innerText = "Watch Ad to Respawn";
            restartBtn.disabled = false;
        }

        // --- THE EXACT AD CALLBACKS FROM YOUR IMAGE ---
        const callbacks = {
            adFinished: () => {
                console.log("Ad Finished");
                isPaused = false;
                isGameOver = false;
                overlay.classList.remove('active');
                speed = 0;
                playerX = 0;
                position = 0;
                restartBtn.innerText = "Respawn & Drive Again";
                restartBtn.disabled = true;
            },
            adError: (error) => {
                console.log("Ad Error:", error);
                // CRITICAL: Resume game even if ad fails!
                isPaused = false;
                isGameOver = false;
                overlay.classList.remove('active');
                restartBtn.innerText = "Respawn & Drive Again";
                restartBtn.disabled = true;
            },
            adStarted: () => {
                console.log("Ad Started");
                isPaused = true; // PAUSE THE GAME
                overlay.querySelector('h1').innerText = "🎥 Playing Ad...";
                overlay.querySelector('p').innerText = "Please wait 30 seconds";
                restartBtn.innerText = "Waiting...";
                restartBtn.disabled = true;
            }
        };

        function requestAd() {
            // Simulating CrazyGames SDK as it won't run locally
            console.log("Requesting Rewarded Ad...");
            callbacks.adStarted(); 

            // Simulate a 3-second ad loading
            setTimeout(() => {
                // 90% chance success, 10% chance error
                if(Math.random() < 0.1) {
                    callbacks.adError("Network Timeout");
                } else {
                    callbacks.adFinished();
                }
            }, 3000);
        }

        restartBtn.addEventListener('click', () => {
            if(!isGameOver) return;
            requestAd();
        });

        // --- MAIN LOOP ---
        app.ticker.add(() => {
            if (!isPaused && !isGameOver) {
                updateGame();
            }
            renderFrame(); // Always render, even when paused to show static screen
        });

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            app.renderer.resize(window.innerWidth, window.innerHeight);
            worldContainer.x = app.screen.width / 2;
            worldContainer.y = app.screen.height / 2 + 50;
        });

        console.log("Game Loaded Successfully! Drive with arrow keys.");
    </script>
</body>
</html>
