<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helix Gold | Luxury Heliciculture & Snail Farming Enterprise</title>
    <style>
        /* Modern Design System Root variables */
        :root {
            --primary-dark: #0b1a0e;
            --forest-green: #14321a;
            --gold-glow: #e5c158;
            --gold-gradient: linear-gradient(135deg, #f3d987 0%, #ba9427 100%);
            --text-light: #f4f7f4;
            --text-muted: #a3b8a6;
            --pure-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        /* Smooth Reset & Elegant Base Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--primary-dark);
            color: var(--text-light);
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* Premium Header Styling */
        header {
            background: rgba(11, 26, 14, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Custom Corporate Circle Typography Branding */
        .brand-identity {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .premium-circle-icon {
            width: 28px;
            height: 28px;
            border: 4px solid #ba9427;
            border-image: var(--gold-gradient) 1;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            box-shadow: 0 0 15px rgba(229, 193, 88, 0.3);
        }

        .brand-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(120deg, #ffffff 40%, #cbb063 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .nav-menu a:hover {
            color: var(--gold-glow);
        }

        /* Immersive Premium Hero Section */
        .hero-viewport {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 40px;
            background: radial-gradient(circle at top right, rgba(20, 50, 26, 0.4) 0%, rgba(11, 26, 14, 1) 70%), 
                        url('https://unsplash.com') center/cover no-repeat;
            margin-top: 0;
        }

        .hero-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-headline-block {
            max-width: 750px;
        }

        .hero-tag {
            color: var(--gold-glow);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            display: block;
        }

        .hero-headline-block h1 {
            font-size: 64px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 25px;
            color: var(--pure-white);
        }

        .hero-headline-block p {
            font-size: 19px;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 600px;
        }

        /* Luxury Call-To-Action Elements */
        .action-link {
            display: inline-flex;
            align-items: center;
            background: var(--gold-gradient);
            color: var(--primary-dark);
            padding: 18px 40px;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 14px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(186, 148, 39, 0.2);
            transition: all 0.4s ease;
        }

        .action-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(186, 148, 39, 0.4);
        }

        /* Elegant Grid Showcases */
        .showcase-matrix {
            padding: 140px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header-group {
            margin-bottom: 80px;
        }

        .section-header-group h2 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--pure-white);
        }

        .section-header-group p {
            color: var(--gold-glow);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
        }

        .matrix-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            border-radius: 8px;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .matrix-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(229, 193, 88, 0.3);
            transform: translateY(-5px);
        }

        .card-graphic-indicator {
            font-size: 32px;
            margin-bottom: 30px;
            background: rgba(229, 193, 88, 0.1);
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(229, 193, 88, 0.2);
        }

        .matrix-card h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--pure-white);
        }

        .matrix-card p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* High-End Design Contact Suite */
        .corporate-contact-vault {
            background: linear-gradient(180deg, rgba(11,26,14,1) 0%, rgba(20,50,26,0.3) 100%);
            border-top: 1px solid var(--glass-border);
            padding: 140px 40px;
            text-align: center;
        }

        .vault-content {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Beautiful layout styling for your specific phone lettering requests */
        .designed-phone-anchor {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 40px 0;
            color: var(--pure-white);
            text-decoration: none;
            background: rgba(255, 255, 255, 0.02);
            padding: 20px 50px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            transition: all 0.4s ease;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.01);
        }

        .designed-phone-anchor:hover {
            border-color: var(--gold-glow);
            box-shadow: 0 0 30px rgba(229, 193, 88, 0.15);
            color: var(--gold-glow);
        }

        .circle-emblem {
            font-size: 44px;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(229, 193, 88, 0.6));
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Premium Executive Footer */
        footer {
            background-color: #060d07;
            padding: 40px 40px;
            border-top: 1px solid var(--glass-border);
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Clean Adaptations for Ultra-Responsive Infrastructure */
        @media (max-width: 992px) {
            .hero-headline-block h1 { font-size: 48px; }
            .designed-phone-anchor { font-size: 32px; padding: 15px 35px; }
            .circle-emblem { font-size: 30px; }
        }

        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .hero-headline-block h1 { font-size: 38px; }
            .designed-phone-anchor { font-size: 22px; gap: 10px; padding: 12px 25px; }
        }
    </style>
</head>
<body>

    <!-- Executive Fixed Header Infrastructure -->
    <header>
        <div class="nav-container">
            
                <span class="premium-circle-icon"></span>
