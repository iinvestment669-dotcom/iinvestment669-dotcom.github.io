<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Heist - 3D Prototype</title>
    <!-- Import Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #87CEEB; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; pointer-events: none; }
        #ui h1 { margin: 0; font-size: 24px; }
        #ui p { margin: 5px 0; font-size: 14px; opacity: 0.8; }
        #status { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: white; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 5px; font-weight: bold; z-index: 10; text-align: center; }
        #adOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; display: none; justify-content: center; align-items: center; font-size: 24px; z-index: 100; flex-direction: column; }
        #adOverlay span { font-size: 16px; color: #888; margin-top: 10px; }
        button { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); padding: 15px 30px; background: #e94560; color: white; border: none; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:hover { background: #c73652; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>🚗 City Heist</h1>
        <p>Drive to the red blip to steal the car!</p>
    </div>
    <div id="status">Use WASD to drive</div>
    
    <!-- Professional Ad Overlay -->
    <div id="adOverlay">
        <div>📺 Ad Playing...</div>
        <span>Game is paused. Please wait.</span>
    </div>

    <button id="respawnBtn" disabled>Respawn Car (Watch Ad)</button>

    <script type="module">
        import * as THREE from 'three';

        // --- PROFESSIONAL GAME SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50); // Fog for distance

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- WORLD ASSETS (City) ---
        // Ground
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Road
        const roadGeo = new THREE.PlaneGeometry(4, 100);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -20;
        scene.add(road);

        // Buildings
        function createBuilding(x, z, w, h, d) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h/2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }
        for(let i=0; i<15; i++) {
            createBuilding(Math.random()*40 - 20, Math.random()*40 - 30, 2+Math.random()*3, 2+Math.random()*8, 2+Math.random()*3);
        }

        // --- THE PLAYER CAR ---
        const carGroup = new THREE.Group();
        // Car Body
        const carGeo = new THREE.BoxGeometry(2, 1, 4);
        const carMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
        const carMesh = new THREE.Mesh(carGeo, carMat);
        carMesh.position.y = 0.5;
        carMesh.castShadow = true;
        carGroup.add(carMesh);
        // Car cabin
        const cabinGeo = new THREE.BoxGeometry(1.5, 0.5, 2);
        const cabinMat = new THREE.MeshLambertMaterial({ color: 0x88ccff });
        const cabinMesh = new THREE.Mesh(cabinGeo, cabinMat);
        cabinMesh.position.set(0, 1, -0.5);
        carGroup.add(cabinMesh);

        carGroup.position.set(0, 0.5, 10);
        scene.add(carGroup);

        // --- TARGET BLIP (Objective) ---
        const targetGroup = new THREE.Group();
        const targetMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const targetSphere = new THREE.Mesh(new THREE.SphereGeometry(0.5), targetMat);
        targetGroup.add(targetSphere);
        // Floating animation
        const targetPivot = new THREE.Group();
        targetPivot.position.set(5, 3, -15);
        targetPivot.add(targetGroup);
        scene.add(targetPivot);

        // --- GAME STATE & PHYSICS ---
        let isPaused = false;
        let gameRunning = true;
        let speed = 0;
        const maxSpeed = 0.3;
        const acceleration = 0.01;
        const friction = 0.98;
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // UI Elements
        const statusEl = document.getElementById('status');
        const adOverlay = document.getElementById('adOverlay');
        const respawnBtn = document.getElementById('respawnBtn');

        // --- THE EXACT AD LOGIC FROM YOUR SCREENSHOT ---
        const callbacks = {
            adFinished: () => {
                console.log("Ad finished");
                isPaused = false;
                adOverlay.style.display = 'none';
                statusEl.innerText = "Driving resumed!";
                respawnBtn.disabled = true;
                
                // REWARD: Respawn the car at start
                carGroup.position.set(0, 0.5, 10);
                carGroup.rotation.y = 0;
                speed = 0;
            },
            adError: (error) => {
                console.log("Ad error:", error);
                isPaused = false;
                adOverlay.style.display = 'none';
                statusEl.innerText = "Ad failed. Game resumed.";
                respawnBtn.disabled = true;
            },
            adStarted: () => {
                console.log("Ad started");
                isPaused = true; // PAUSE GAME
                adOverlay.style.display = 'flex'; // SHOW OVERLAY
                statusEl.innerText = "⏸️ Playing Ad... Game Paused";
                respawnBtn.disabled = true;
            }
        };

        function requestAd(type) {
            // In a real environment, use: window.CrazyGames.SDK.ad.requestAd(type, callbacks);
            // Simulating it here for demonstration:
            console.log(`Requesting ${type} ad...`);
            callbacks.adStarted();
            
            // Simulate a 3-second ad
            setTimeout(() => {
                // Simulate 20% chance of error
                if(Math.random() < 0.2) {
                    callbacks.adError("Network Error");
                } else {
                    callbacks.adFinished();
                }
            }, 3000);
        }

        respawnBtn.addEventListener('click', () => {
            if(!isPaused) requestAd("rewarded");
        });

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused && gameRunning) {
                // 1. Car Physics
                if (keys.w) speed = Math.min(speed + acceleration, maxSpeed);
                else if (keys.s) speed = Math.max(speed - acceleration, -maxSpeed/2);
                else speed *= friction;

                if (Math.abs(speed) > 0.001) {
                    carGroup.position.x += Math.sin(carGroup.rotation.y) * speed;
                    carGroup.position.z += Math.cos(carGroup.rotation.y) * speed;
                    
                    if (keys.a) carGroup.rotation.y += 0.03;
                    if (keys.d) carGroup.rotation.y -= 0.03;
                }

                // 2. Target Animation
                targetPivot.rotation.y += 0.02;

                // 3. Win Condition (reached target)
                const dist = carGroup.position.distanceTo(new THREE.Vector3(targetPivot.position.x, 0, targetPivot.position.z));
                if (dist < 2) {
                    statusEl.innerText = "🏆 HEIST SUCCESSFUL! Car stolen!";
                    gameRunning = false;
                    respawnBtn.innerText = "Start New Game (Ad)";
                    respawnBtn.disabled = false;
                }

                // 4. Camera Follow (Third person)
                const camOffset = new THREE.Vector3(-5, 3, -5);
                const targetCamPos = carGroup.position.clone().add(camOffset);
                camera.position.lerp(targetCamPos, 0.1);
                camera.lookAt(carGroup.position);
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- WINDOW RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
