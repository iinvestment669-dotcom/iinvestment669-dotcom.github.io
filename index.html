<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Hero</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #1a1a2e; color: white; }
        #score { font-size: 48px; margin: 20px; }
        #hero { font-size: 100px; cursor: pointer; transition: transform 0.1s; }
        #hero:active { transform: scale(0.9); }
        button { padding: 12px 24px; font-size: 18px; cursor: pointer; background: #e94560; border: none; color: white; border-radius: 8px; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 20px; font-style: italic; color: #aaa; }
    </style>
</head>
<body>

    <h1>Clicker Hero</h1>
    <div id="score">0</div>
    <div id="hero">🦸</div>
    <br>
    <button id="rewardBtn">Watch Ad for +50 Points</button>
    <div id="status">Game Running</div>

    <script>
        // --- GAME LOGIC ---
        let score = 0;
        let isGamePaused = false; // IMPORTANT: Track this state
        let audioEnabled = true; // We simulate audio with a simple beep timer
        const scoreElement = document.getElementById('score');
        const statusElement = document.getElementById('status');
        const heroElement = document.getElementById('hero');
        const rewardBtn = document.getElementById('rewardBtn');

        // Click to earn
        heroElement.addEventListener('click', () => {
            if (isGamePaused) {
                alert("Game is paused! Please wait for the ad to finish.");
                return;
            }
            score += 10;
            updateScore();
        });

        function updateScore() {
            scoreElement.innerText = score;
        }

        // Simulate an Audio Loop (A beep every 2 seconds)
        setInterval(() => {
            if (!isGamePaused && audioEnabled) {
                console.log("🔊 *Game Audio Playing*");
            }
        }, 2000);


        // --- CRAZY GAMES SDK INTEGRATION (MATCHING YOUR SCREENSHOT) ---
        
        // 1. Define the callbacks object exactly as shown in your image
        const callbacks = {
            // Runs when the ad ends
            adFinished: () => {
                console.log("End midroll / ad finished");
                resumeGame(); 
                // If it's a rewarded ad, give points here
                score += 50; 
                updateScore();
                statusElement.innerText = "Reward Claimed! +50 Points";
            },
            // Runs if the ad fails to load
            adError: (error) => {
                console.log("Error loading ad:", error);
                resumeGame(); // Critical: Resume even if it fails!
                statusElement.innerText = "Ad Failed. Resuming game.";
            },
            // Runs when the ad starts
            adStarted: () => {
                console.log("Start midroll");
                pauseGame();
            }
        };

        // 2. Helper functions to handle the Warning Box instructions
        function pauseGame() {
            isGamePaused = true;
            audioEnabled = false; // Mute audio
            statusElement.innerText = "⏸️ Ad Playing... Game Paused";
            rewardBtn.disabled = true; // Prevent clicking button twice
        }

        function resumeGame() {
            isGamePaused = false;
            audioEnabled = true; // Unmute audio
            statusElement.innerText = "▶️ Game Resumed";
            rewardBtn.disabled = false;
        }

        // 3. The Request Ad Function (Matching the code in your screenshot)
        function requestAd(type) {
            // This is where you would use: window.CrazyGames.SDK.ad.requestAd(type, callbacks);
            // For this demo, I will simulate the SDK since you don't have it on a local file.
            
            statusElement.innerText = "Loading Ad...";
            console.log(`Attempting to load ${type} ad...`);

            // Simulate ad starting after 1 second
            setTimeout(() => {
                callbacks.adStarted(); 
                
                // Simulate ad finishing after 3 seconds
                setTimeout(() => {
                    callbacks.adFinished(); 
                }, 3000);
            }, 1000);
        }

        // Connect button to the ad request
        rewardBtn.addEventListener('click', () => {
            requestAd("rewarded");
        });

        // Initial state
        updateScore();
        statusElement.innerText = "Game Ready. Click Hero or Watch Ad.";
    </script>
</body>
</html>
