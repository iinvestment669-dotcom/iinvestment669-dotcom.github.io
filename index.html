<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 95%;
            max-width: 1000px;
            height: 92vh;
            background: #16213e;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 18px 24px;
            background: #0f3460;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1a4f7a;
            flex-shrink: 0;
        }

        .chat-header h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .status-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.online {
            background: #34d399;
            color: #064e3b;
        }

        .status-badge.offline {
            background: #f87171;
            color: #7f1d1d;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .user-count {
            background: #1a4f7a;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            white-space: nowrap;
        }

        .online-users {
            padding: 8px 24px;
            background: #0f3460;
            color: #8892b0;
            font-size: 13px;
            border-bottom: 1px solid #1a4f7a;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            min-height: 40px;
            flex-shrink: 0;
        }

        .online-user {
            background: #1a4f7a;
            padding: 2px 14px;
            border-radius: 20px;
            color: #64ffda;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .online-user.typing {
            background: #e94560;
            color: #fff;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .chat-messages {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            background: #1a1a2e;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #16213e;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 3px;
        }

        .message {
            margin-bottom: 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.system {
            justify-content: center;
            color: #8892b0;
            font-size: 13px;
            font-style: italic;
        }

        .message.private {
            background: #1a3a5c;
            border-left: 3px solid #e94560;
            padding: 8px 14px;
            border-radius: 8px;
        }

        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .message-username {
            font-weight: 600;
            color: #64ffda;
            font-size: 14px;
        }

        .message-timestamp {
            color: #8892b0;
            font-size: 11px;
        }

        .message-private-badge {
            color: #e94560;
            font-size: 11px;
            font-weight: 600;
        }

        .message-text {
            color: #ccd6f6;
            word-wrap: break-word;
            margin-top: 4px;
            font-size: 15px;
            line-height: 1.6;
        }

        .typing-indicator {
            color: #8892b0;
            font-style: italic;
            font-size: 13px;
            padding: 6px 24px;
            min-height: 30px;
            flex-shrink: 0;
        }

        .chat-input-area {
            padding: 14px 24px;
            background: #0f3460;
            display: flex;
            gap: 12px;
            border-top: 2px solid #1a4f7a;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #1a4f7a;
            border-radius: 10px;
            background: #16213e;
            color: #ccd6f6;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            border-color: #64ffda;
        }

        .chat-input-area input::placeholder {
            color: #495670;
        }

        .chat-input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-input-area button {
            padding: 12px 32px;
            background: #64ffda;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
            white-space: nowrap;
        }

        .chat-input-area button:hover:not(:disabled) {
            background: #4cd8b0;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(100, 255, 218, 0.3);
        }

        .chat-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.97);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: #16213e;
            padding: 48px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            min-width: 340px;
            max-width: 90%;
        }

        .login-box h2 {
            color: #64ffda;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .login-box .subtitle {
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #1a4f7a;
            border-radius: 10px;
            background: #1a1a2e;
            color: #ccd6f6;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .login-box input:focus {
            border-color: #64ffda;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: #64ffda;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-box button:hover:not(:disabled) {
            background: #4cd8b0;
            transform: translateY(-2px);
        }

        .login-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-status {
            margin-top: 14px;
            color: #8892b0;
            font-size: 13px;
        }

        .login-status.connected {
            color: #34d399;
        }

        .login-status.disconnected {
            color: #f87171;
        }

        @media (max-width: 640px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
            
            .login-box {
                min-width: 0;
                padding: 32px 24px;
            }

            .chat-header h1 {
                font-size: 16px;
            }

            .chat-input-area {
                padding: 12px 16px;
                gap: 8px;
            }

            .chat-input-area button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .chat-messages {
                padding: 16px;
            }

            .header-right {
                gap: 8px;
            }

            .user-count {
                font-size: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>💬 Chat Room</h2>
            <p class="subtitle">Connect with people around the world</p>
            <input type="text" id="usernameInput" placeholder="Enter your username..." maxlength="30" autofocus>
            <button id="joinBtn">Join Chat</button>
            <div id="loginStatus" class="login-status disconnected">⏳ Connecting to server...</div>
        </div>
    </div>

    <!-- Main Chat -->
    <div class="chat-container" id="chatContainer" style="display:none;">
        <div class="chat-header">
            <h1>💬 Chat Room</h1>
            <div class="header-right">
                <span id="statusBadge" class="status-badge offline">● Offline</span>
                <span class="user-count" id="userCount">0 online</span>
            </div>
        </div>
        <div class="online-users" id="onlineUsers">
            <span style="color:#495670;">No users online</span>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message... (@username for private)" maxlength="500" disabled>
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // Socket connection
        const socket = io('http://localhost:3000', {
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 10,
            reconnectionDelay: 1000
        });

        // DOM elements
        const loginOverlay = document.getElementById('loginOverlay');
        const chatContainer = document.getElementById('chatContainer');
        const usernameInput = document.getElementById('usernameInput');
        const joinBtn = document.getElementById('joinBtn');
        const loginStatus = document.getElementById('loginStatus');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const userCount = document.getElementById('userCount');
        const onlineUsers = document.getElementById('onlineUsers');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusBadge = document.getElementById('statusBadge');

        let currentUser = '';
        let typingTimeout = null;
        let isConnected = false;
        let isJoining = false;

        // Update connection status
        function updateConnection(connected) {
            isConnected = connected;
            
            // Update login status
            if (loginStatus) {
                loginStatus.textContent = connected ? '✅ Connected to server' : '⏳ Connecting to server...';
                loginStatus.className = `login-status ${connected ? 'connected' : 'disconnected'}`;
            }
            
            // Update header badge
            if (statusBadge) {
                statusBadge.className = `status-badge ${connected ? 'online' : 'offline'}`;
                statusBadge.textContent = connected ? '● Online' : '● Offline';
            }

            // Enable/disable input
            if (messageInput) {
                messageInput.disabled = !connected || !currentUser;
            }
            if (sendBtn) {
                sendBtn.disabled = !connected || !currentUser;
            }

            // Show reconnection message
            if (!connected && currentUser) {
                const reconnectMsg = document.getElementById('reconnectMsg');
                if (!reconnectMsg) {
                    const div = document.createElement('div');
                    div.className = 'message system';
                    div.id = 'reconnectMsg';
                    div.innerHTML = '<span>⚠️ Disconnected from server. Reconnecting...</span>';
                    messagesDiv.appendChild(div);
                    scrollToBottom();
                }
            } else if (connected) {
                const reconnectMsg = document.getElementById('reconnectMsg');
                if (reconnectMsg) reconnectMsg.remove();
            }
        }

        // Helper functions
        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false 
            });
        }

        function getAvatarColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            const colors = ['#e94560', '#f5a623', '#64ffda', '#4a9eff', '#a855f7', '#f472b6', '#34d399', '#fb923c'];
            return colors[Math.abs(hash) % colors.length];
        }

        function getInitials(name) {
            return name.charAt(0).toUpperCase();
        }

        function scrollToBottom() {
            setTimeout(() => {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 50);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function displayMessage(msg) {
            const div = document.createElement('div');
            
            if (msg.type === 'system') {
                div.className = 'message system';
                div.innerHTML = `<span>${escapeHtml(msg.message)}</span>`;
            } else if (msg.type === 'private') {
                div.className = 'message private';
                const color = getAvatarColor(msg.from);
                div.innerHTML = `
                    <div class="message-avatar" style="background:${color}">${getInitials(msg.from)}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-username">${escapeHtml(msg.from)}</span>
                            <span class="message-timestamp">${formatTime(msg.timestamp)}</span>
                            <span class="message-private-badge">🔒 Private</span>
                        </div>
                        <div class="message-text">${escapeHtml(msg.message)}</div>
                    </div>
                `;
            } else {
                const isOwn = msg.userId === socket.id;
                const color = getAvatarColor(msg.username);
                div.className = 'message';
                div.style.justifyContent = isOwn ? 'flex-end' : 'flex-start';
                
                div.innerHTML = `
                    ${!isOwn ? `<div class="message-avatar" style="background:${color}">${getInitials(msg.username)}</div>` : ''}
                    <div class="message-content">
                        <div class="message-header" style="${isOwn ? 'justify-content: flex-end;' : ''}">
                            <span class="message-username">${isOwn ? 'You' : escapeHtml(msg.username)}</span>
                            <span class="message-timestamp">${formatTime(msg.timestamp)}</span>
                        </div>
                        <div class="message-text" style="${isOwn ? 'text-align: right;' : ''}">${escapeHtml(msg.message)}</div>
                    </div>
                    ${isOwn ? `<div class="message-avatar" style="background:${color}">${getInitials(msg.username)}</div>` : ''}
                `;
            }
            
            messagesDiv.appendChild(div);
            scrollToBottom();
        }

        function updateUserList(users) {
            onlineUsers.innerHTML = '';
            if (users && users.length > 0) {
                users.forEach(user => {
                    const span = document.createElement('span');
                    span.className = 'online-user';
                    span.textContent = user.username;
                    span.dataset.userId = user.id;
                    onlineUsers.appendChild(span);
                });
            } else {
                onlineUsers.innerHTML = '<span style="color:#495670;">No users online</span>';
            }
        }

        // Socket events
        socket.on('connect', () => {
            console.log('✅ Connected to server');
            updateConnection(true);
            
            if (currentUser && !isJoining) {
                socket.emit('user join', currentUser);
            }
        });

        socket.on('connect_error', (err) => {
            console.error('❌ Connection error:', err.message);
            updateConnection(false);
        });

        socket.on('disconnect', () => {
            console.log('❌ Disconnected');
            updateConnection(false);
        });

        socket.on('reconnect', () => {
            console.log('🔄 Reconnected');
            updateConnection(true);
        });

        socket.on('chat history', (history) => {
            messagesDiv.innerHTML = '';
            history.forEach(msg => displayMessage(msg));
            scrollToBottom();
        });

        socket.on('chat message', (msg) => {
            displayMessage(msg);
        });

        socket.on('user joined', ({ user, users }) => {
            if (user.id !== socket.id) {
                displayMessage({ type: 'system', message: `${user.username} joined the chat` });
            }
            userCount.textContent = `${users.length} online`;
            updateUserList(users);
        });

        socket.on('user left', ({ username, users }) => {
            displayMessage({ type: 'system', message: `${username} left the chat` });
            userCount.textContent = `${users.length} online`;
            updateUserList(users);
        });

        socket.on('user typing', ({ username, isTyping }) => {
            document.querySelectorAll('.online-user').forEach(el => {
                if (el.textContent === username) {
                    el.classList.toggle('typing', isTyping);
                }
            });
            typingIndicator.textContent = isTyping ? `${username} is typing...` : '';
        });

        socket.on('private message', (msg) => displayMessage(msg));
        socket.on('private message sent', (msg) => displayMessage(msg));

        // Login
        joinBtn.addEventListener('click', () => {
            if (!isConnected) {
                alert('⚠️ Cannot connect to server. Make sure the server is running.');
                return;
            }
            
            const username = usernameInput.value.trim() || 'Anonymous';
            if (username.length > 30) {
                alert('Username must be 30 characters or less');
                return;
            }
            
            currentUser = username;
            isJoining = true;
            socket.emit('user join', username);
            
            loginOverlay.style.display = 'none';
            chatContainer.style.display = 'flex';
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
            
            setTimeout(() => { isJoining = false; }, 1000);
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinBtn.click();
        });

        // Send message
        const sendMessage = () => {
            if (!isConnected) {
                alert('⚠️ Disconnected. Reconnecting...');
                return;
            }
            
            const text = messageInput.value.trim();
            if (!text) return;
            
            const privateMatch = text.match(/^@(\w+)\s+(.+)/);
            if (privateMatch) {
                const target = privateMatch[1];
                const msg = privateMatch[2];
                const userElements = onlineUsers.querySelectorAll('.online-user');
                let targetId = null;
                userElements.forEach(el => {
                    if (el.textContent === target) targetId = el.dataset.userId;
                });
                
                if (targetId) {
                    socket.emit('private message', { targetId, message: msg });
                    messageInput.value = '';
                } else {
                    alert(`User "${target}" not found`);
                }
            } else {
                socket.emit('chat message', { message: text });
                messageInput.value = '';
            }
            messageInput.focus();
        };

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Typing
        messageInput.addEventListener('input', () => {
            if (messageInput.value.trim() && isConnected) {
                socket.emit('typing', true);
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('typing', false);
                }, 1000);
            }
        });

        // Focus reconnect
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !isConnected && currentUser) {
                socket.connect();
            }
        });

        console.log('💬 Chat app loaded');
    </script>
</body>
</html>
